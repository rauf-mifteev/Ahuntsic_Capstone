; PlatformIO — compile le firmware que Wokwi simule (PC-41 / PC-43 / PC-62).
; Build local : `pio run` depuis ce dossier (wokwi/). Le binaire sort
; directement dans .pio/build/esp32dev/ — voir wokwi.toml, qui pointe
; dessus sans passer par un script de copie.
;
; NOTE IMPORTANTE — bug connu du toolchain :
; La version "stable" de la plateforme communautaire pioarduino peut livrer
; un toolchain incompatible avec board = esp32dev (binaires compilés pour
; ESP32-S3 uniquement), ce qui provoque l'erreur au linking :
;   'xtensa-esp32-elf-g++' is not recognized as an internal or external command
; On épingle donc une version antérieure, confirmée fonctionnelle avec
; esp32dev. Voir corrections-wokwi-render-bd.md pour le détail complet.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
