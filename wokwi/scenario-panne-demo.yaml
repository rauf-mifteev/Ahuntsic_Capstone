name: PC-70 — bascule de demonstration hors ligne
version: 1
author: Test local

steps:
  - wait-serial: "synchronisée."
  - delay: 1000ms

  - set-control:
      part-id: bouton-couvercle
      control: pressed
      value: 1
  - wait-serial: "Couvercle : OUVERTURE"
  - delay: 8000ms
  - set-control:
      part-id: bouton-couvercle
      control: pressed
      value: 0
  - wait-serial: "Couvercle : FERMETURE"

  - delay: 8000ms
  - set-control:
      part-id: bouton-couvercle
      control: pressed
      value: 1
  - wait-serial: "Couvercle : OUVERTURE"
  - delay: 8000ms
  - set-control:
      part-id: bouton-couvercle
      control: pressed
      value: 0
  - wait-serial: "Couvercle : FERMETURE"

  - delay: 90000ms
