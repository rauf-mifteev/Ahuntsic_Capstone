services:
  - type: web
    name: pilulier-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/sante
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: SERVICE_ANALYSE_URL

        sync: false

  - type: web
    name: pilulier-analyse-images
    runtime: python
    plan: free
    rootDir: analyse-images
    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /sante
    envVars:
      - key: MODELE_STRATEGIE

        value: seuillage
